# NVIDIA baseline collection workflow.
#
# A deliberately small, NVIDIA-only workflow: it checks out optest for the
# collector, checks out the selected target repo into ./target for its
# baseline/ operator modules, runs inside that repo's NV container image, and
# executes the baseline collector (src/nv_baseline/collect_baseline_nvidia.py)
# on a single card against target/baseline. Unlike ops-test.yaml there is no
# multi-backend matrix, no reporting, upload, or Feishu steps.
#
# Per-repo image + output json name live in .github/configs/baseline_repos.yaml;
# the `prepare` job resolves them so onboarding a repo is a config-only change.
#
# Example of the collector command this workflow runs:
#   python3 src/nv_baseline/collect_baseline_nvidia.py \
#     --device 7 --output op_vllm_perf_baseline.json \
#     --ops-dir target/baseline
name: nv-baseline
# Per-run title in the Actions list, e.g. "nv-baseline-FlagTrain".
run-name: nv-baseline-${{ github.event.inputs.repo }}

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'optest source branch. Empty = dispatched branch.'
        required: false
        default: ''
      repo:
        description: 'Target repository providing baseline/ operator modules.'
        required: true
        type: choice
        default: FlagGems-vllm
        options:
          - FlagGems-vllm
          - FlagGems-sglang
          - FlagGems
          - FlagTrain
      ref:
        description: 'Target repository ref. Empty = the repo default branch.'
        required: false
        default: ''
      auto_update:
        description: 'Commit the generated baseline json into the optest data/ dir.'
        required: false
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  # Resolve the per-repo image and output file name from
  # .github/configs/baseline_repos.yaml, so the collect job (and its container)
  # can be fully config-driven.
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      output: ${{ steps.resolve.outputs.output }}
      target_repo: ${{ steps.resolve.outputs.target_repo }}
    steps:
      - name: Checkout optest workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - id: resolve
        shell: python3 {0}
        env:
          REPO_INPUT: ${{ github.event.inputs.repo }}
        run: |
          import os
          import yaml

          with open('.github/configs/baseline_repos.yaml') as f:
              cfg = yaml.safe_load(f)

          repo = os.environ.get('REPO_INPUT', '').strip()
          repos = cfg.get('repos', {})
          if repo not in repos:
              raise SystemExit(
                  f"repo '{repo}' is not defined in baseline_repos.yaml "
                  f"(known: {', '.join(repos)})"
              )
          rc = repos[repo]
          image = rc.get('image', '').strip()
          output = rc.get('output', '').strip()
          if not image or not output:
              raise SystemExit(f"repo '{repo}' must set both 'image' and 'output'")
          org = cfg.get('org', 'flagos-ai')

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"image={image}\n")
              out.write(f"output={output}\n")
              out.write(f"target_repo={org}/{repo}\n")

  collect:
    name: nv-baseline (H800)
    needs: prepare
    runs-on: h800-flaggems-weekly
    timeout-minutes: 720
    # Only the collect job needs write access, to commit the generated baseline
    # back into data/ when auto_update is on; the top-level stays read-only.
    permissions:
      contents: write
    container:
      image: ${{ needs.prepare.outputs.image }}
      volumes:
        - /data:/data
        - /home:/home
        - /tmp:/tmp
      options: >-
        --uts=host
        --ipc=host
        --user 0
        --security-opt=seccomp=unconfined
        --privileged
        --ulimit=stack=67108864
        --ulimit=memlock=-1
        --shm-size=32G
        --gpus all
    env:
      # Comma-separated cards dispatch to the multi-GPU scheduler (one operator
      # consumer per card); progress is printed as operators complete.
      DEVICE: '0,1,2,3,4,5,6,7'
      OUTPUT: ${{ needs.prepare.outputs.output }}
      # Target repo providing baseline/ operator modules, as <org>/<repo>.
      TARGET_REPO: ${{ needs.prepare.outputs.target_repo }}
      # Empty ref -> actions/checkout uses the target repo's default branch.
      TARGET_REF: ${{ github.event.inputs.ref }}
      # When true, the generated baseline json is committed into data/.
      AUTO_UPDATE: ${{ github.event.inputs.auto_update }}
    steps:
      # Checkout optest itself at the workspace root: provides src/nv_baseline
      # and hardware_specs.json. The target library is checked out into ./target.
      - name: Checkout optest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      # Checkout the TARGET repo (whose baseline/ dir holds the operator
      # modules) into ./target, with a 3-attempt retry like ops-test.yaml.
      - name: Checkout target repository (attempt 1)
        id: checkout-attempt-1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
        continue-on-error: true
      - name: Wait before target checkout retry 2
        if: steps.checkout-attempt-1.outcome == 'failure'
        run: sleep 30s
      - name: Checkout target repository (attempt 2)
        id: checkout-attempt-2
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target
        continue-on-error: true
      - name: Wait before target checkout retry 3
        if: steps.checkout-attempt-2.outcome == 'failure'
        run: sleep 30s
      - name: Checkout target repository (attempt 3)
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: target

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/target"

      # FlagTrain only: its baseline modules hard-depend on DeepSpeed and
      # Megatron-LM (native() raises if missing, no torch fallback), so install
      # them per baseline/README.md before collection. Other repos ship their
      # stack in the image and skip this step.
      - name: Install FlagTrain baseline dependencies
        if: ${{ github.event.inputs.repo == 'FlagTrain' }}
        shell: bash --login -e -o pipefail {0}
        run: |
          echo "[Deps] Installing FlagTrain baseline dependencies"
          WORK="${GITHUB_WORKSPACE}/flagtrain_deps"
          mkdir -p "${WORK}"
          # FlagTrain reuses the vllm image; remove vllm so it cannot interfere
          # with the DeepSpeed / Megatron stack this baseline needs.
          python3 -m pip uninstall -y vllm || true

          # DeepSpeed / Megatron ship CUDA C++ extensions that are JIT-compiled
          # at collection time. This image provides CUDA via the pip package
          # nvidia/cu13, which is not on the compiler/linker search path, so the
          # JIT build fails with "ld: cannot find -lcudart". Resolve the cu13
          # root, create the unversioned libcudart.so symlink the linker needs,
          # and export the toolchain env to GITHUB_ENV so the later GPU-check and
          # collection steps (where the JIT build actually runs) inherit it.
          CU13_ROOT="$(python3 -c 'import importlib.util, os; s=importlib.util.find_spec("nvidia.cu13"); print(os.path.dirname(s.origin) if s and s.origin else "")')"
          if [ -z "${CU13_ROOT}" ] || [ ! -d "${CU13_ROOT}" ]; then
            CU13_ROOT="/flagos/lib/python3.12/site-packages/nvidia/cu13"
          fi
          echo "[Deps] CUDA (cu13) root: ${CU13_ROOT}"
          CU13_LIB="${CU13_ROOT}/lib"
          # The linker wants libcudart.so; the wheel ships only libcudart.so.NN.
          if [ -d "${CU13_LIB}" ] && [ ! -e "${CU13_LIB}/libcudart.so" ]; then
            CUDART="$(ls "${CU13_LIB}"/libcudart.so.* 2>/dev/null | head -1 || true)"
            if [ -n "${CUDART}" ]; then
              ln -sf "${CUDART}" "${CU13_LIB}/libcudart.so"
              echo "[Deps] Linked ${CU13_LIB}/libcudart.so -> ${CUDART}"
            else
              echo "[Deps] WARNING: no libcudart.so.* found under ${CU13_LIB}"
            fi
          fi
          {
            echo "CUDA_HOME=${CU13_ROOT}"
            echo "CUDA_PATH=${CU13_ROOT}"
            echo "PATH=${CU13_ROOT}/bin:${PATH}"
            echo "LD_LIBRARY_PATH=${CU13_LIB}:${LD_LIBRARY_PATH:-}"
            echo "LIBRARY_PATH=${CU13_LIB}:${LIBRARY_PATH:-}"
          } >> "$GITHUB_ENV"
          # Apply to this step too (GITHUB_ENV only affects subsequent steps).
          export CUDA_HOME="${CU13_ROOT}" CUDA_PATH="${CU13_ROOT}"
          export PATH="${CU13_ROOT}/bin:${PATH}"
          export LD_LIBRARY_PATH="${CU13_LIB}:${LD_LIBRARY_PATH:-}"
          export LIBRARY_PATH="${CU13_LIB}:${LIBRARY_PATH:-}"

          # Prebuilt wheels: DeepSpeed kernels, CUTLASS ops, NVIDIA resiliency ext.
          # deepspeed-kernels has no plain 0.0.1 on PyPI (only 0.0.1.devNNNN
          # prereleases), so pin the latest dev build explicitly.
          python3 -m pip install \
            deepspeed-kernels==0.0.1.dev1698255861 \
            nvidia-cutlass==3.8.0.0 \
            nvidia-resiliency-ext==0.6.0
          # DeepSpeed from source (main).
          if [ ! -d "${WORK}/DeepSpeed" ]; then
            git clone --depth 1 https://github.com/deepspeedai/DeepSpeed.git "${WORK}/DeepSpeed"
          fi
          python3 -m pip install -e "${WORK}/DeepSpeed"
          # Megatron-LM from source (main), provides megatron.core.
          if [ ! -d "${WORK}/Megatron-LM" ]; then
            git clone --depth 1 https://github.com/NVIDIA/Megatron-LM.git "${WORK}/Megatron-LM"
          fi
          python3 -m pip install -e "${WORK}/Megatron-LM"
          echo "[Deps] Verifying imports"
          python3 -c "import deepspeed, megatron.core; print('deepspeed', deepspeed.__version__); print('megatron.core OK')"

      - name: Check NVIDIA GPU and profiler
        shell: bash --login -e -o pipefail {0}
        run: |
          echo "[GPU check] nvidia-smi:"
          nvidia-smi
          echo "[GPU check] ncu (Nsight Compute):"
          # The collector profiles each kernel with NCU; fail early if missing.
          if ! command -v ncu >/dev/null 2>&1; then
            echo "[GPU check] ERROR: 'ncu' (NVIDIA Nsight Compute) not found on PATH."
            exit 1
          fi
          ncu --version

      # Note: the collector returns non-zero whenever any operator is not
      # "completed" (including merely skipped or profiling_incomplete). We do
      # NOT let that non-zero exit fail this step directly; the dedicated
      # "Classify collection result" step below reads the produced JSON and
      # decides the final failed/warning/pass verdict. Only the pre-flight
      # checks here are hard failures.
      - name: Run NV baseline collection
        shell: bash --login -o pipefail {0}
        run: |
          set -e
          OPS_DIR="${GITHUB_WORKSPACE}/target/baseline"
          echo "[Collect] Target repo: ${TARGET_REPO}"
          echo "[Collect] Operator dir: ${OPS_DIR}"
          echo "[Collect] Device: ${DEVICE}"
          echo "[Collect] Output: ${OUTPUT}"
          if [ ! -d "${OPS_DIR}" ]; then
            echo "[Collect] ERROR: baseline operator dir not found: ${OPS_DIR}"
            echo "[Collect] The target repo must provide a baseline/ directory."
            exit 1
          fi
          echo "[Collect] Command: python3 src/nv_baseline/collect_baseline_nvidia.py --device ${DEVICE} --output ${OUTPUT} --ops-dir ${OPS_DIR}"
          # Capture the collector's exit code without failing the step; the
          # classify step makes the final call from the produced JSON.
          set +e
          python3 src/nv_baseline/collect_baseline_nvidia.py \
            --device "${DEVICE}" \
            --output "${OUTPUT}" \
            --ops-dir "${OPS_DIR}"
          rc=$?
          echo "[Collect] collector exit code: ${rc}"

      # Grade the run from the per-operator statuses the collector records in a
      # sidecar status file, "${OUTPUT}.work/status.json" (the published baseline
      # JSON carries no run-time bookkeeping). status.json holds a "tasks" map
      # (name -> {status, ...}) and an "interrupted" flag:
      #   - failed  : any operator "failed", or the run crashed/was interrupted
      #               (status.json missing/unparseable, empty tasks, a
      #               non-terminal status left behind, or interrupted). Exits 1,
      #               so the data/ update step is skipped and the job is red.
      #   - warning : no failures but at least one "profiling_incomplete";
      #               emits a ::warning:: annotation and keeps the job green.
      #   - pass    : everything "completed" (operators merely "skipped" do not
      #               fail the run).
      - name: Classify collection result
        id: classify
        if: always()
        shell: python3 {0}
        run: |
          import json
          import os
          import pathlib
          import sys
          from collections import Counter

          terminal = {"completed", "failed", "skipped", "profiling_incomplete"}
          output = pathlib.Path(os.environ["OUTPUT"])
          status_path = pathlib.Path(f"{os.environ['OUTPUT']}.work") / "status.json"
          if not output.exists():
              print("::error::baseline output missing; collector likely crashed")
              sys.exit(1)
          if not status_path.exists():
              print("::error::collection status file missing; collector likely crashed")
              sys.exit(1)
          try:
              status = json.loads(status_path.read_text())
          except (ValueError, OSError) as exc:
              print(f"::error::cannot parse collection status: {exc}")
              sys.exit(1)

          tasks = status.get("tasks", {})
          if not tasks:
              print("::error::no operator tasks recorded; collector likely crashed")
              sys.exit(1)

          counts = Counter(t.get("status") for t in tasks.values())
          summary = " ".join(f"{k}={v}" for k, v in sorted(counts.items()))
          print(f"[Classify] statuses: {summary}")

          failed = sorted(n for n, t in tasks.items() if t.get("status") == "failed")
          incomplete = sorted(
              n for n, t in tasks.items() if t.get("status") == "profiling_incomplete"
          )
          nonterminal = sorted(
              n for n, t in tasks.items() if t.get("status") not in terminal
          )

          if status.get("interrupted"):
              print("::error::collection was interrupted before finishing")
              result = "failed"
          elif nonterminal:
              print(
                  "::error::operator(s) left in a non-terminal state "
                  f"(collector likely crashed): {', '.join(nonterminal)}"
              )
              result = "failed"
          elif failed:
              print(f"::error::{len(failed)} operator(s) failed: {', '.join(failed)}")
              result = "failed"
          elif incomplete:
              print(
                  f"::warning::{len(incomplete)} operator(s) profiling_incomplete: "
                  f"{', '.join(incomplete)}"
              )
              result = "warning"
          else:
              result = "pass"

          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"result={result}\n")
          print(f"[Classify] final result: {result}")
          if result == "failed":
              sys.exit(1)

      # Commit the freshly generated baseline into the optest checkout's data/
      # directory. Runs only when auto_update is on AND the classify step graded
      # the run pass or warning (not failed), so a failed collection never
      # overwrites a known-good baseline. A warning run (profiling_incomplete
      # only) still updates. Pushes to the branch optest was checked out from.
      - name: Update baseline in data/
        if: ${{ env.AUTO_UPDATE == 'true' && (steps.classify.outputs.result == 'pass' || steps.classify.outputs.result == 'warning') }}
        shell: bash --login -e -o pipefail {0}
        env:
          PUSH_BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || github.ref_name }}
        run: |
          SRC="${GITHUB_WORKSPACE}/${OUTPUT}"
          DEST_DIR="${GITHUB_WORKSPACE}/data"
          DEST="${DEST_DIR}/${OUTPUT}"
          if [ ! -f "${SRC}" ]; then
            echo "[Update] ERROR: expected baseline not found: ${SRC}"
            exit 1
          fi
          mkdir -p "${DEST_DIR}"
          cp "${SRC}" "${DEST}"
          cd "${GITHUB_WORKSPACE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/${OUTPUT}"
          if git diff --cached --quiet; then
            echo "[Update] data/${OUTPUT} unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "chore(nv-baseline): update data/${OUTPUT} for ${TARGET_REPO}"
          # Rebase onto the latest remote branch tip in case it moved, then push.
          git pull --rebase origin "${PUSH_BRANCH}"
          git push origin "HEAD:${PUSH_BRANCH}"
          echo "[Update] Committed and pushed data/${OUTPUT} to ${PUSH_BRANCH}."

      - name: Upload baseline artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nv-baseline-${{ github.event.inputs.repo }}-${{ github.run_id }}
          path: ${{ env.OUTPUT }}
          if-no-files-found: warn

      # Per-operator collection logs: the collector writes one collector.log per
      # operator attempt under <OUTPUT>.work/<op>/<uuid>/, plus the sidecar
      # status.json that the classify step grades from. Uploaded on always() so
      # skip/failure/partial reasons (and the final statuses) are available even
      # when collection fails. Only the .log files and status.json are kept, not
      # the NCU reports or the intermediate per-operator json, to keep the
      # artifact small.
      - name: Upload collection logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: nv-baseline-logs-${{ github.event.inputs.repo }}-${{ github.run_id }}
          path: |
            ${{ env.OUTPUT }}.work/**/collector.log
            ${{ env.OUTPUT }}.work/status.json
          if-no-files-found: warn
