# Per-repo configuration for the nv-baseline workflow (NVIDIA-only baseline
# collection), a sibling of repos.yaml. To onboard a new repo, add one entry
# under `repos:`:
#
#   <RepoName>:
#     image: <NV image that bundles the repo's stack + Nsight Compute (ncu)>
#     output: op_<short>_perf_baseline.json   # produced baseline file name
#
# The `output` is the JSON file the collector writes and the workflow uploads.
# `default_repo` selects the workflow input's default choice.
#
# Optional, FlagGems-vllm only:
#
#   vllm_version: "0.32.0"
#
# The baseline image bundles a fixed vllm (see the image tag, e.g. :0.24.0).
# Set `vllm_version` to collect against a different vllm release without
# rebuilding the image: the workflow pip-installs that exact version before
# collection. Quote it so YAML keeps it a string (0.32.0 is fine unquoted,
# but 0.32 would parse as a float). Leave it unset/empty to keep the image's
# bundled vllm untouched.
#
# Note: the per-operator `label` (the framework version each operator was
# collected against) is detected automatically by the collector from the
# packages installed in the container, so it needs no per-repo configuration
# here.

org: flagos-ai
default_repo: FlagGems-vllm

repos:
  FlagGems-vllm:
    image: harbor.baai.ac.cn/flaggems/nv_baseline/flaggems-vllm-nv-baseline-ncu-2026.3.1:0.24.0
    output: op_vllm_perf_baseline.json
    # Collect against this vllm release instead of the image's bundled one.
    # Empty/unset keeps the image's vllm. See the header note above.
    vllm_version: "0.32.0"

  FlagGems-sglang:
    image: harbor.baai.ac.cn/flaggems/nv_baseline/flaggems-sglang-nv-baseline-ncu-2025.2.0:0.5.21
    output: op_sglang_perf_baseline.json

  # Placeholder image: replace with the real NV + ncu image once built,
  # following the same naming as the entries above.
  FlagGems:
    image: harbor.baai.ac.cn/flaggems/nv_baseline/flaggems-nv-baseline-ncu:latest
    output: op_flaggems_perf_baseline.json

  # FlagTrain reuses the vllm baseline image, then the workflow uninstalls vllm
  # and installs DeepSpeed / Megatron-LM (see baseline/README.md) before
  # collection, since its baseline modules hard-depend on them.
  FlagTrain:
    image: harbor.baai.ac.cn/flaggems/nv_baseline/flaggems-vllm-nv-baseline-ncu-2026.3.1:0.24.0
    output: op_flagtrain_perf_baseline.json
