# ---------------------------------------------------------------------------
# Central per-repo configuration for the shared ops-test workflow.
#
# This single file lets flagos-ai/optest drive operator tests for every FlagOS
# library repo. The `repo` workflow input selects one entry under `repos:`.
# The MAP KEY (e.g. FlagGems) is used for three things at once:
#   1. checkout target     -> <org>/<key>
#   2. upload library_name  -> passed to op-monitor as `library_name=<key>`
#   3. Feishu notification label
# so there is no separate github/library_name/import_name field. The tested
# library is auto-detected at runtime by flagos-optest using the import names
# maintained in src/flagos_optest/run_tests.py.
#
# Container images are defined per hardware in .github/configs/backends/<NAME>.yaml
# and shared by all repos. A repo only needs a `container_images:` block when its
# images differ from those defaults (e.g. FlagGems-sglang ships sglang images).
#
# To onboard a new repo: add one block under `repos:` with its default_branch,
# enabled backends, and (optionally) container_images / deps / base_data /
# timeout overrides. Use `deps.default.<package>` for repository-wide package
# overrides and `deps.<backend>.<package>` for hardware-specific overrides.
# Set `enabled: false` at either level to disable an inherited package (for
# example, when testing FlagGems itself). Also add its
# (import_name, display_name) pair to _KNOWN_LIBS in
# src/flagos_optest/run_tests.py so runtime metadata reaches summary.json.
# ---------------------------------------------------------------------------

# GitHub organization that owns every target repo. Combined with the repo key
# to form the checkout target "<org>/<repo>".
org: flagos-ai

# Defaults applied to every repo unless overridden in its block below.
defaults:
  # Timeout in seconds for each accuracy or performance subprocess. Override
  # per repo via `op_cmd_timeout`.
  op_cmd_timeout: 600
  # Per-vendor "Run ops tests" STEP timeout (minutes). The container/native
  # job keeps a large hard cap at the job level (GitHub Actions cannot read a
  # matrix value for a job-level timeout); the real per-repo limit lives on the
  # test step. Override per repo via `ops_test_timeout_minutes`.
  ops_test_timeout_minutes: 240
  # Shared packages merged with backend and repository package settings.
  # Resolution is performed independently for each package name and each field
  # in this exact order (later layers override earlier fields):
  #   1. defaults.deps
  #   2. .github/configs/backends/<backend>.yaml: deps
  #   3. repos.<repo>.deps.default
  #   4. repos.<repo>.deps.<backend>
  # A package or field absent from a later layer remains inherited. `enabled`
  # defaults to true only when no layer sets it. A later `enabled: false`
  # disables the merged package; that false remains inherited until an even
  # later layer explicitly sets `enabled: true` to re-enable it. Backend
  # selection under repos.<repo>.backends is separate: a disabled backend is
  # removed before any package settings are resolved.
  #
  # `version` pins the requirement. `display_name`, `enabled`, and `priority`
  # control workflow behavior; every other key is converted from snake_case to
  # a `uv pip install --kebab-case` option. Enabled packages are installed by
  # ascending `priority` (default 1000), then package name.
  # Artifact: packages/flag-gems/5.5.0.dev20261123/
  #           flag_gems-5.5.0.dev20261123-py3-none-any.whl
  deps:
    flag-gems:
      display_name: FlagGems
      priority: 200
      version: 5.5.0.dev20261123
      index_url: https://resource.flagos.net/repository/flagos-pypi-daily/simple
      no_deps: true

repos:
  # =========================================================================
  FlagGems:
    # Branch used when the `branch` workflow input is empty.
    default_branch: master
    # Optional ops-baseline JSON the nv-baseline workflow commits under optest's
    # data/ dir; ops-test passes it via --base-data for vs-baseline comparison.
    base_data: data/op_flaggems_perf_baseline.json
    # The full operator suite needs the longer per-command timeout.
    op_cmd_timeout: 1800
    # Full operator suite; 910B alone runs ~15h, so allow a long step timeout.
    ops_test_timeout_minutes: 1440
    # FlagGems uses current runtime images for T-Head PPU and AMD. Both continue
    # to use their shared FlagTree upgrade configuration.
    container_images:
      PPU-ZW810E: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-thead-ppu2.1.0:2.3.0
      W7900D: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-amd-rocm7.2.4:2.3.0
    # The checkout itself is installed editable later, so disable the inherited
    # FlagGems wheel for this repository.
    deps:
      default:
        flag-gems:
          enabled: false
    # Backends this repo runs. enabled:false skips the backend entirely.
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: true}
      P800: {enabled: true}
      W7900D: {enabled: true}
      TX8110: {enabled: false}
      S60: {enabled: true}   # Enflame op-list path lives on this runner only.

  # =========================================================================
  FlagGems-vllm:
    default_branch: main
    # Optional ops-baseline JSON (relative to the optest repo root, i.e.
    # GITHUB_WORKSPACE). Points at the baseline the nv-baseline workflow commits
    # into optest's data/ dir, so ops-test consumes the freshly collected
    # baseline. Only FlagGems-vllm wires an external baseline today; other repos
    # leave this unset so --base-data is not passed.
    base_data: data/op_vllm_perf_baseline.json
    # Uses the shared backend images (vllm), no override needed.
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

  # =========================================================================
  FlagGems-sglang:
    default_branch: master
    # Ops-baseline JSON the nv-baseline workflow commits under optest's data/
    # dir; ops-test passes it via --base-data so the benchmark reports the
    # vs-baseline ratio. Same wiring as FlagGems-vllm.
    base_data: data/op_sglang_perf_baseline.json
    # sglang ships its own images per backend, so this repo OVERRIDES the shared
    # backend defaults. Keep only backends enabled below.
    container_images:
      910B: harbor.baai.ac.cn/flagos-app/sglang0.5.18-ascend-cann9.0.0:2.1.2-0.1.dev1_g2e568482e
      BI-V150: harbor.baai.ac.cn/flagos-app/sglang0.5.18-iluvatar-corex4.5.0:2.2.0-0.1.dev1_g201484665
      BW1000: harbor.baai.ac.cn/flagos-app/sglang0.5.18-hygon-dtk26.04:2.1.2-0.1.dev1_g440208beb
      C550: harbor.baai.ac.cn/flagos-app/sglang0.5.18-metax-maca3.8.1.3:2.1.2-0.1.dev1_g0900c244b
      H800: harbor.baai.ac.cn/flagos-app/sglang0.5.11-generic-c13.0:2.2.0-0.2.0
      MTT-S5000: harbor.baai.ac.cn/flagos-app/sglang0.5.18-mthreads-musa5.2.0:2.2.0-0.1.dev1_g607b9672c
      P800: harbor.baai.ac.cn/flagos-app/sglang0.5.18-kunlunxin-xre5.37.1:2.1.2-0.1.dev1_g7fb22a0c2
      S60: harbor.baai.ac.cn/flagos-app/sglang0.5.18-enflame-tops1.10.6:2.2.0-0.1.dev1_g65dff2733
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}  # sglang: disabled for now.
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

  # =========================================================================
  FlagTrain:
    default_branch: main
    # Ops-baseline JSON the nv-baseline workflow commits under optest's data/
    # dir; ops-test passes it via --base-data so the benchmark reports the
    # vs-baseline ratio. Same wiring as FlagGems-vllm.
    base_data: data/op_flagtrain_perf_baseline.json
    # The operator suite needs the longer per-command timeout, matching
    # FlagGems; 600s is too tight for FlagTrain's heavier operators.
    op_cmd_timeout: 1800
    # FlagTrain uses Megatron-RL images and maintains vendor dependencies as
    # optional-dependency groups in its own pyproject.toml.
    # NVIDIA images provide the compatible torch/Triton stack. FlagTrain's
    # [tool.uv].exclude-dependencies policy preserves those image packages.
    container_images:
      H800: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-generic-13.3:2.2.0-0.2.3
      BW1000: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-hygon-dtk26.04:2.2.0-0.2.3
      BI-V150: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-iluvatar-corex4.5.0:2.2.0-0.2.3
      PPU-ZW810E: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-thead-ppu2.1.0:2.3.0
      P800: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-kunlunxin-xre5.37.1:2.2.0-0.2.3
      910B: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-ascend-cann9.0.0:2.2.0-0.2.3
      C550: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-metax-maca3.8.1.3:2.2.0-0.2.3
      MTT-S5000: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-mthreads-musa5.2.0:2.2.0-0.2.3
      S60: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-enflame-tops1.10.6:2.2.0-0.2.3
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

  # =========================================================================
  FlagAttention:
    default_branch: main
    op_cmd_timeout: 900
    # Uses the shared backend images (vllm), no override needed.
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

  # =========================================================================
  FlagTensor:
    default_branch: main
    # Uses the shared backend images (vllm), no override needed.
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

# ---------------------------------------------------------------------------
# Optional shared dependency overrides/additions use the same package map as
# `defaults.deps`. Target-project dependencies themselves should remain in the
# target repository's pyproject.toml optional-dependencies. The same exact
# package key must be used in every layer that intends to override it.
#
#   repos:
#     SomeRepo:
#       deps:
#         default:
#           extra-pkg:
#             version: 1.2.3
#             index_url: https://example.invalid/simple
#             no_deps: true
#           flag-gems:
#             enabled: false
#         H800:
#           flag-gems:
#             enabled: true  # re-enables the repo-default exception on H800
#
# Optional backend-package exclusions (omit by default):
#
#   repos:
#     BackendException:
#       deps:
#         H800:
#           flagtree-nvidia:
#             enabled: false
#
# Merge precedence is `defaults.deps` < backend `deps` < repo `deps.default` <
# repo `deps.<backend>`. Merge is field-by-field for each package, not a whole
# package replacement. An inherited `enabled: false` remains false when later
# layers omit `enabled`; only a later explicit `enabled: true` re-enables it.
# After disabled packages are removed, install order is ascending `priority`
# and then package name. This install order does not change merge precedence.
# FlagTree packages use `target: /opt/flagtree`, so the workflow stages the
# target and replaces it only after installation succeeds.
# ---------------------------------------------------------------------------
