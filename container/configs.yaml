        app_env: ""

      mthreads-musa5.2.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-mthreads-musa5.2.0:2.3.0
        backend: MTT-S5000
        vendor: mthreads
        flagtree_package: flagtree-mthreads
        plugin_fl_version: ""
