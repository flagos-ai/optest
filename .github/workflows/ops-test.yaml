# Full-range operator test workflow (centralized in flagos-ai/optest).
#
# A single workflow tests ANY FlagOS library repo. The `repo` input selects a
# repo defined in .github/configs/repos.yaml; the workflow checks out that repo
# into ./target, installs it, and runs this repo's shared optest package against it.
#
# Per-repo config: .github/configs/repos.yaml  (org, default_branch, images,
#                  backends, deps, base_data, timeout overrides)
# Shared backend hardware config: .github/configs/backends/<NAME>.yaml
# vendors: Nvidia,MThreads,KunLunXin,Iluvatar,Ascend,Hygon,Metax,THead,Cambricon,AMD,TsingMicro,Enflame
name: ops-test
run-name: ops-test_${{ inputs.repo }}

permissions:
  contents: read

env:
  TZ: Asia/Shanghai

on:
  workflow_dispatch:
    inputs:
      repo:
        description: 'Target repository configured in repos.yaml.'
        required: true
        type: choice
        default: FlagGems
        options:
          - FlagGems
          - FlagGems-vllm
          - FlagGems-sglang
          - FlagTrain
          - FlagAttention
      branch:
        description: 'optest source branch. Empty = dispatched branch.'
        required: false
        default: ''
      ref:
        description: 'Target repository ref. Empty = configured default branch.'
        required: false
        default: ''
      vendors:
        description: 'Vendors to run, comma-separated. Empty = all enabled vendors.'
        required: false
        default: ''
      ops:
        description: 'Operators to include, comma-separated. Empty = all stages.'
        required: false
        default: ''
      exclude_ops:
        description: 'Operators to exclude, comma-separated. Empty = exclude none.'
        required: false
        default: ''
      upload_log:
        description: 'Result upload control. Empty = upload; any value = skip.'
        required: false
        default: ''
      send_feishu:
        description: 'Feishu control. Empty = send; any value = skip.'
        required: false
        default: ''
      test_date:
        description: 'Result date (YYYY-MM-DD). Empty = today.'
        required: false
        default: ''

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      date: ${{ steps.get-date.outputs.DATE }}
      checkout_ref: ${{ steps.build-matrix.outputs.checkout_ref }}
      target_repo: ${{ steps.build-matrix.outputs.target_repo }}
      library_name: ${{ steps.build-matrix.outputs.library_name }}
      matrix_container: ${{ steps.build-matrix.outputs.matrix_container }}
      ops: ${{ steps.build-matrix.outputs.ops }}
      exclude_ops: ${{ steps.build-matrix.outputs.exclude_ops }}
      publish_results: ${{ steps.build-matrix.outputs.publish_results }}
      send_feishu: ${{ steps.build-matrix.outputs.send_feishu }}
    steps:
      # Checkout optest itself (this repo) for repos.yaml + backend configs.
      # `branch` input picks the optest branch; empty -> the dispatched ref.
      - name: Checkout optest workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      - id: get-date
        env:
          # Optional test_date input; empty for default runs.
          TEST_DATE_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_date || '' }}
        run: echo "DATE=${TEST_DATE_INPUT:-$(date '+%Y-%m-%d')}" >> "$GITHUB_OUTPUT"

      - id: build-matrix
        shell: python3 {0}
        env:
          # `repo` is required; the others are optional and empty by default.
          REPO_INPUT: ${{ github.event.inputs.repo }}
          # TARGET repo code ref (branch/commit/tag); empty -> repo default_branch.
          REF_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || '' }}
          VENDORS_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.vendors || '' }}
          OPS_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ops || '' }}
          EXCLUDE_OPS_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.exclude_ops || '' }}
          UPLOAD_LOG_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.upload_log || '' }}
          SEND_FEISHU_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.send_feishu || '' }}
        run: |
          import json
          import os
          import yaml

          with open('.github/configs/repos.yaml') as f:
              main = yaml.safe_load(f)

          repo = os.environ.get('REPO_INPUT', '').strip()
          if repo not in main['repos']:
              raise SystemExit(
                  f"repo '{repo}' is not defined in repos.yaml "
                  f"(known: {', '.join(main['repos'])})"
              )
          rc = main['repos'][repo]
          org = main['org']
          # The repo key IS both the checkout target name and the upload label.
          target_repo = f"{org}/{repo}"
          library_name = repo

          # Target repo code ref: explicit `ref` input wins, else the repo's
          # configured default_branch.
          checkout_ref = os.environ.get('REF_INPUT', '').strip() or rc['default_branch']

          # Shared step and per-command defaults, each overridable per repo.
          default_timeout = main.get('defaults', {}).get('ops_test_timeout_minutes', 240)
          repo_timeout = rc.get('ops_test_timeout_minutes', default_timeout)
          default_op_cmd_timeout = main.get('defaults', {}).get(
              'op_cmd_timeout', 600
          )
          op_cmd_timeout = rc.get('op_cmd_timeout', default_op_cmd_timeout)

          images = rc.get('container_images', {})
          deps_cfg = rc.get('deps', {}) or {}
          base_data = (rc.get('base_data') or '').strip()

          # Parse optional vendor filter (case-insensitive). Empty -> all.
          vendors_filter = {
              v.strip().lower()
              for v in os.environ.get('VENDORS_INPUT', '').split(',')
              if v.strip()
          }

          # Every enabled backend runs inside a container. For each, start from
          # the shared hardware yaml and apply per-repo overrides.
          container_include = []
          for name, cfg in rc['backends'].items():
              if not cfg.get('enabled'):
                  continue
              with open(f'.github/configs/backends/{name}.yaml') as f:
                  backend = yaml.safe_load(f)
              if vendors_filter and backend.get('vendor', '').lower() not in vendors_filter:
                  continue

              # container_image: repos.yaml container_images[<backend>]
              # OVERRIDES the default from backends/<NAME>.yaml.
              if name in images:
                  backend['container_image'] = images[name]

              # deps: hardware default (backend yaml) + repo-wide (deps.default)
              # + backend-specific (deps.<backend>), joined into one requirement list.
              merged_deps = []
              merged_deps += backend.get('deps', []) or []
              merged_deps += deps_cfg.get('default', []) or []
              merged_deps += deps_cfg.get(name, []) or []
              backend['deps'] = ' '.join(merged_deps)

              backend['base_data'] = base_data
              backend['ops_test_timeout'] = repo_timeout
              backend['op_cmd_timeout'] = op_cmd_timeout
              backend['test_env'] = json.dumps(backend.get('test_env') or {})
              backend['test_gpus'] = str(backend.get('test_gpus') or '').strip()
              container_include.append(backend)

          # ops: empty input -> "all" operator stages; otherwise the given ops.
          ops = os.environ.get('OPS_INPUT', '').strip() or 'all'
          exclude_ops = os.environ.get('EXCLUDE_OPS_INPUT', '').strip()
          publish_results = 'true' if not os.environ.get('UPLOAD_LOG_INPUT', '').strip() else 'false'
          send_feishu = 'true' if not os.environ.get('SEND_FEISHU_INPUT', '').strip() else 'false'

          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"checkout_ref={checkout_ref}\n")
              out.write(f"target_repo={target_repo}\n")
              out.write(f"library_name={library_name}\n")
              out.write(f"matrix_container={json.dumps({'include': container_include})}\n")
              out.write(f"ops={ops}\n")
              out.write(f"exclude_ops={exclude_ops}\n")
              out.write(f"publish_results={publish_results}\n")
              out.write(f"send_feishu={send_feishu}\n")

  # All backends run inside a container.
  test-container:
    name: ${{ needs.prepare.outputs.library_name }} (${{ matrix.name }})
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.matrix_container).include[0] != null }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix_container) }}
    concurrency:
      # Serialize overlapping jobs per library and backend. GitHub retains at
      # most one pending job per group; longer FIFO queues must dispatch
      # sequentially.
      group: ${{ needs.prepare.outputs.library_name }}-${{ matrix.name }}
      cancel-in-progress: false
    runs-on: ${{ matrix.runner_labels }}
    # Job-level hard cap only. GitHub Actions evaluates a job-level
    # timeout-minutes before the matrix is available, so it cannot read a
    # per-repo value here. The REAL per-repo limit is applied at the step level
    # on "Run ops tests" via matrix.ops_test_timeout (from repos.yaml). This cap
    # is kept large so it never pre-empts that step; self-hosted runners have no
    # hard 6h limit, so the step timeout is honoured.
    timeout-minutes: 1440
    container:
      image: ${{ matrix.container_image }}
      options: ${{ matrix.container_options }}
      volumes: ${{ matrix.container_volumes }}
    env:
      DATE: ${{ needs.prepare.outputs.date }}
      # Library/repo name drives the results path, archive name and upload label.
      REPOSITORY_NAME: ${{ needs.prepare.outputs.library_name }}
      TARGET_REPOSITORY: ${{ needs.prepare.outputs.target_repo }}
      TARGET_REF: ${{ needs.prepare.outputs.checkout_ref }}
      TEST_OPS: ${{ needs.prepare.outputs.ops }}
      TEST_EXCLUDE_OPS: ${{ needs.prepare.outputs.exclude_ops }}
      OUTPUT_DIR: ${{ matrix.output_base_dir }}/${{ needs.prepare.outputs.library_name }}/${{ needs.prepare.outputs.date }}/logs_results_${{ needs.prepare.outputs.date }}
    steps:
      # Checkout optest itself (this repo) at workspace root: provides src/
      # and configs. `branch` input picks the optest branch; empty -> the
      # dispatched ref. The target library is checked out separately into ./target.
      - name: Checkout optest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.branch || '' }}

      # Checkout the TARGET repo (the library under test) into ./target, with
      # the same 3-attempt retry the previous single-repo workflow used.
      - name: Checkout target repository (attempt 1)
        id: checkout-attempt-1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.target_repo }}
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          path: target
        continue-on-error: true
      - name: Wait before target checkout retry 2
        id: sleep-1
        if: steps.checkout-attempt-1.outcome == 'failure'
        run: sleep 30s

      - name: Checkout target repository (attempt 2)
        id: checkout-attempt-2
        if: steps.checkout-attempt-1.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.target_repo }}
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          path: target
        continue-on-error: true
      - name: Wait before target checkout retry 3
        id: sleep-2
        if: steps.checkout-attempt-2.outcome == 'failure'
        run: sleep 30s

      - name: Checkout target repository (attempt 3)
        id: checkout-attempt-3
        if: steps.checkout-attempt-2.outcome == 'failure'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.target_repo }}
          ref: ${{ needs.prepare.outputs.checkout_ref }}
          path: target

      - name: Fix git safe directory
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}/target"

      # Resolve the TARGET repo's actual commit from the ./target checkout.
      # The GitHub context (GITHUB_SHA/GITHUB_REF_NAME) describes the optest run,
      # not the library under test, so the Feishu notification must read the
      # commit straight from the checked-out target instead.
      - name: Capture target repo commit
        id: target-info
        if: always()
        continue-on-error: true
        run: |
          SHA=""
          if [ -d "${GITHUB_WORKSPACE}/target/.git" ]; then
            SHA="$(git -C "${GITHUB_WORKSPACE}/target" rev-parse HEAD 2>/dev/null || echo '')"
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - name: Copy root profile to GitHub Actions home
        run: |
          for f in /root/.bash_profile /root/.profile /root/.bashrc; do
            [ -f "$f" ] && cp -f "$f" "$HOME/" || true
          done
          # .bashrc may have interactive guards ([ -z "$PS1" ] or case $-)
          # that prevent conda init / backend env setup from running in
          # non-interactive CI shells. Extract those lines (conda init,
          # `source .../set_env.sh`, FLAGTREE_BACKEND export, and the
          # `. /root/.local/bin/env` sourcing) and append to .bash_profile
          # instead, which is sourced by login shells without any
          # interactive check.
          #
          # huawei: set_env.sh
          # mthreads: $HOME/.local/bin/env
          # kunlunxin: conda.sh and conda activate
          #
          if [ -f /root/.bashrc ]; then
            # Pin $HOME -> /root: extracted lines use "$HOME/..." (e.g.
            # . "$HOME/.local/bin/env"), but the login shell that sources
            # .bash_profile has $HOME set to the GHA home, not /root.
            grep -E '(conda\.sh|conda activate|set_env\.sh|\.local/bin/env)' /root/.bashrc \
              | sed 's#\$HOME\/\.local#/root\/\.local#g' >> "$HOME/.bash_profile" || true
          fi
          # GitHub Actions job containers force HOME=/github/home. In the 910B
          # image, the Ascend/MKI libraries loaded by torch_npu derive their
          # default work path from HOME; with /github/home they can print
          # "path string is NULL" to stdout during `import torch`. Huawei's ATB
          # set_env.sh compares that command's full stdout to "True" for ABI
          # auto-detection, so the extra text makes it incorrectly select
          # cxx_abi_0.
          #
          # Important: ASCEND_WORK_PATH must be exported before any profile
          # line sources Ascend/ATB set_env.sh. Keep these lines at the top of
          # $HOME/.bash_profile, ahead of the set_env.sh lines extracted above.
          # Also write it to GITHUB_ENV so later GHA steps have it before their
          # own login shell starts reading system/vendor profiles.
          if [ "${{ matrix.vendor }}" = "Ascend" ] && [ -f /usr/local/Ascend/nnal/atb/set_env.sh ]; then
            echo "[Ascend env] Configuring ASCEND_WORK_PATH before sourcing Ascend/ATB profiles"
            echo "[Ascend env] before rewrite: ASCEND_WORK_PATH=${ASCEND_WORK_PATH:-<unset>}"
            echo "[Ascend env] before rewrite: ATB_HOME_PATH=${ATB_HOME_PATH:-<unset>}"
            echo "[Ascend env] before rewrite: PATH=${PATH:-}"
            echo "[Ascend env] before rewrite: LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
            echo "[Ascend env] .bash_profile before rewrite:"
            nl -ba "$HOME/.bash_profile" || true
            ASCEND_WORK_PATH="${ASCEND_WORK_PATH:-/tmp/ascend_work/${GITHUB_RUN_ID:-manual}}"
            mkdir -p "$ASCEND_WORK_PATH"
            [ -n "${GITHUB_ENV:-}" ] && echo "ASCEND_WORK_PATH=$ASCEND_WORK_PATH" >> "$GITHUB_ENV"
            echo "[Ascend env] exported ASCEND_WORK_PATH=$ASCEND_WORK_PATH"
            {
              echo 'export ASCEND_WORK_PATH="${ASCEND_WORK_PATH:-/tmp/ascend_work/${GITHUB_RUN_ID:-manual}}"'
              echo 'mkdir -p "$ASCEND_WORK_PATH"'
              cat "$HOME/.bash_profile"
            } > "$HOME/.bash_profile.tmp"
            mv "$HOME/.bash_profile.tmp" "$HOME/.bash_profile"
            echo "[Ascend env] .bash_profile after rewrite:"
            nl -ba "$HOME/.bash_profile" || true
            echo "[Ascend env] verifying a fresh login shell after profile source"
            bash --login -c '
              set +e
              echo "[Ascend env] after login source: ASCEND_WORK_PATH=${ASCEND_WORK_PATH:-<unset>}"
              echo "[Ascend env] after login source: ATB_HOME_PATH=${ATB_HOME_PATH:-<unset>}"
              echo "[Ascend env] after login source: PATH=${PATH:-}"
              echo "[Ascend env] after login source: LD_LIBRARY_PATH=${LD_LIBRARY_PATH:-}"
              python3 -c "import torch; print(torch.compiled_with_cxx11_abi())" >/tmp/ascend_torch_abi_probe.out 2>/tmp/ascend_torch_abi_probe.err
              probe_rc=$?
              echo "[Ascend env] torch ABI probe rc=${probe_rc}"
              python3 -c "from pathlib import Path; print(\"[Ascend env] torch ABI probe stdout repr=\", repr(Path(\"/tmp/ascend_torch_abi_probe.out\").read_text())); print(\"[Ascend env] torch ABI probe stderr repr=\", repr(Path(\"/tmp/ascend_torch_abi_probe.err\").read_text()))"
            ' || true
          fi

      - name: Configure package index and install optest
        env: ${{ fromJSON(matrix.test_env) }}
        shell: bash --login -e -o pipefail {0}
        run: |
          run_logged_command() {
            local description="$1"
            shift
            local exit_code
            echo "[Install dependencies] Starting: ${description}"
            printf '[Install dependencies] Command:'
            printf ' %q' "$@"
            printf '\n'
            if "$@"; then
              exit_code=0
            else
              exit_code=$?
            fi
            echo "[Install dependencies] Finished: ${description} (exit_code=${exit_code})"
            return "${exit_code}"
          }

          PACKAGE_INDEX_URLS=(
            https://pypi.tuna.tsinghua.edu.cn/simple
            https://mirrors.aliyun.com/pypi/simple/
            https://mirrors.cloud.tencent.com/pypi/simple/
            https://mirrors.163.com/pypi/simple/
          )

          run_with_index_fallback() {
            local installer="$1"
            local description="$2"
            shift 2
            local index_url
            local attempted=" "
            local candidates=("${PACKAGE_INDEX_URLS[@]}")
            if [ "${installer}" = "uv" ] && [ -n "${UV_DEFAULT_INDEX:-}" ]; then
              candidates=("${UV_DEFAULT_INDEX}" "${candidates[@]}")
            fi

            for index_url in "${candidates[@]}"; do
              if [[ "${attempted}" == *" ${index_url} "* ]]; then
                continue
              fi
              attempted="${attempted}${index_url} "
              echo "[Package index] ${description}: trying ${index_url}"
              if [ "${installer}" = "pip" ]; then
                if run_logged_command \
                  "${description} via ${index_url}" \
                  env -u PIP_EXTRA_INDEX_URL -u PIP_TRUSTED_HOST \
                  PIP_CONFIG_FILE=/dev/null \
                  PIP_INDEX_URL="${index_url}" \
                  "$@"; then
                  echo "[Package index] ${description}: selected ${index_url}"
                  return 0
                fi
              elif run_logged_command \
                "${description} via ${index_url}" \
                env -u UV_INDEX UV_DEFAULT_INDEX="${index_url}" \
                "$@"; then
                export UV_DEFAULT_INDEX="${index_url}"
                echo "UV_DEFAULT_INDEX=${UV_DEFAULT_INDEX}" >> "$GITHUB_ENV"
                echo "[Package index] ${description}: selected ${index_url}"
                return 0
              fi
              echo "[Package index] ${description}: failed with ${index_url}"
            done

            echo "[Package index] ${description}: all configured indexes failed"
            return 1
          }

          echo "[Package index] Configured indexes, in fallback order:"
          printf '[Package index] - %s\n' "${PACKAGE_INDEX_URLS[@]}"

          ACTIVE_PYTHON=$(command -v python3)
          if command -v uv >/dev/null 2>&1; then
            echo "[Install dependencies] uv is already available; skipping installation."
          else
            echo "[Install dependencies] Purpose: install uv for target repository dependency resolution"
            run_with_index_fallback \
              pip \
              "uv installation" \
              "${ACTIVE_PYTHON}" -m pip install uv
          fi
          echo "[Install dependencies] uv version: $(uv --version)"
          # Install this optest checkout so the workflow exercises the same
          # packaged GPU-check command before target dependencies are resolved.
          echo "[Install dependencies] Purpose: install the optest source that provides the test and report commands"
          echo "[Install dependencies] Source: optest checkout pyproject.toml"
          run_with_index_fallback \
            uv \
            "optest source installation" \
            uv pip install --python "${ACTIVE_PYTHON}" .

      - name: Check GPU availability
        shell: bash --login -e -o pipefail {0}
        run: |
          echo "[GPU check] Running GPU availability check script: flagos-gpu-check --format json"
          # Use JSON output and parse it with python3 (stdlib) instead of
          # grepping text: in --format json mode the command prints ONLY the
          # JSON document to stdout (progress tables and the vendor line go to
          # stderr, still visible in the step log), so parsing is exact and
          # robust against formatting changes.
          set +e
          GPU_JSON=$(flagos-gpu-check --format json)
          GPU_RC=$?
          set -e
          if [ -n "${GPU_JSON}" ]; then
            echo "[GPU check] GPU availability check JSON:"
            echo "${GPU_JSON}"
          fi
          if [ -n "${{ matrix.test_gpus }}" ]; then
            # A backend can deliberately override the detected GPUs. The check
            # still runs for logging and metadata, but its result does not gate
            # tests when an explicit list is configured.
            AVAILABLE_GPUS="${{ matrix.test_gpus }}"
            echo "[GPU check] Using configured test_gpus override: ${AVAILABLE_GPUS}"
          else
            # Capture the exit code explicitly (instead of relying on set -e)
            # so a failure is reported clearly before we stop. A failed GPU
            # check means we have no reliable GPU list, so the job must exit 1.
            if [ "${GPU_RC}" -ne 0 ]; then
              echo "[GPU check] ERROR: 'flagos-gpu-check' failed with exit code ${GPU_RC}."
              exit 1
            fi
            # Extract available_gpus (a CSV string, e.g. "0,1,2") from the JSON.
            # A parse failure or empty list exits 1 (handled via PARSE_RC).
            set +e
            AVAILABLE_GPUS=$(printf '%s' "${GPU_JSON}" | python3 -c 'import json, sys; v = str(json.load(sys.stdin).get("available_gpus", "")).strip(); print(v) if v else sys.exit("[GPU check] ERROR: JSON contains no available_gpus.")')
            PARSE_RC=$?
            set -e
            if [ "${PARSE_RC}" -ne 0 ]; then
              echo "[GPU check] ERROR: failed to parse available_gpus from GPU-check JSON (rc=${PARSE_RC})."
              exit 1
            fi
          fi
          echo "[GPU check] Available GPUs: ${AVAILABLE_GPUS}"
          if [ "${{ matrix.vendor }}" = "KunLunXin" ]; then
            AVAILABLE_GPUS=$(printf '%s\n' "${AVAILABLE_GPUS}" | awk -F, '
              {
                filtered = ""
                for (i = 1; i <= NF; i++) {
                  if ($i != "0") {
                    if (filtered != "") {
                      filtered = filtered ","
                    }
                    filtered = filtered $i
                  }
                }
                print filtered
              }
            ')
            echo "[GPU check] KunLunXin skips GPU 0; using GPUs: ${AVAILABLE_GPUS}"
          fi
          echo "AVAILABLE_GPUS=${AVAILABLE_GPUS}" >> "$GITHUB_ENV"
          if [ "${GPU_RC}" -eq 0 ]; then
            printf '%s' "${GPU_JSON}" | python3 -c '
          import json
          import os
          import sys

          data = json.load(sys.stdin)
          fields = {
              "FLAGOS_GPU_VENDOR": data.get("vendor"),
              "FLAGOS_GPU_DEVICE": data.get("device"),
              "FLAGOS_GPU_DRIVER": data.get("driver"),
              "FLAGOS_GPU_RUNTIME": data.get("runtime"),
              "FLAGOS_GPU_RUNTIME_VERSION": data.get("runtime_version"),
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              for name, value in fields.items():
                  value = "" if value is None else str(value)
                  if "\n" in value or "\r" in value:
                      raise SystemExit(f"[GPU check] ERROR: invalid newline in {name}")
                  env_file.write(f"{name}={value}\n")
                  display_value = value or "<unknown>"
                  print(f"[GPU check] Exported {name}={display_value}")
          '
          else
            echo "[GPU check] Metadata unavailable; GPU environment variables were not exported."
          fi

      - name: Install target repository and dependencies
        env: ${{ fromJSON(matrix.test_env) }}
        shell: bash --login -e -o pipefail {0}
        run: |
          run_logged_command() {
            local description="$1"
            shift
            local exit_code
            echo "[Install dependencies] Starting: ${description}"
            printf '[Install dependencies] Command:'
            printf ' %q' "$@"
            printf '\n'
            if "$@"; then
              exit_code=0
            else
              exit_code=$?
            fi
            echo "[Install dependencies] Finished: ${description} (exit_code=${exit_code})"
            return "${exit_code}"
          }

          PACKAGE_INDEX_URLS=(
            https://pypi.tuna.tsinghua.edu.cn/simple
            https://mirrors.aliyun.com/pypi/simple/
            https://mirrors.cloud.tencent.com/pypi/simple/
            https://mirrors.163.com/pypi/simple/
          )

          run_uv_with_index_fallback() {
            local description="$1"
            shift
            local index_url
            local attempted=" "
            local candidates=()
            if [ -n "${UV_DEFAULT_INDEX:-}" ]; then
              candidates+=("${UV_DEFAULT_INDEX}")
            fi
            candidates+=("${PACKAGE_INDEX_URLS[@]}")

            for index_url in "${candidates[@]}"; do
              if [[ "${attempted}" == *" ${index_url} "* ]]; then
                continue
              fi
              attempted="${attempted}${index_url} "
              echo "[Package index] ${description}: trying ${index_url}"
              if run_logged_command \
                "${description} via ${index_url}" \
                env -u UV_INDEX UV_DEFAULT_INDEX="${index_url}" \
                "$@"; then
                export UV_DEFAULT_INDEX="${index_url}"
                echo "UV_DEFAULT_INDEX=${UV_DEFAULT_INDEX}" >> "$GITHUB_ENV"
                echo "[Package index] ${description}: selected ${index_url}"
                return 0
              fi
              echo "[Package index] ${description}: failed with ${index_url}"
            done

            echo "[Package index] ${description}: all configured indexes failed"
            return 1
          }

          ACTIVE_PYTHON=$(command -v python3)
          echo "[Install dependencies] Active Python: ${ACTIVE_PYTHON}"
          echo "[Install dependencies] uv version: $(uv --version)"

          # Optional explicit deps remain supported for exceptional backend
          # configuration. Normal target dependencies belong in pyproject.toml.
          EXTRA_DEPS="${{ matrix.deps }}"
          echo "[Install dependencies] Explicit backend dependency source: .github/configs/repos.yaml repos.${REPOSITORY_NAME}.deps.default + repos.${REPOSITORY_NAME}.deps.${{ matrix.name }}"
          echo "[Install dependencies] Detected explicit backend dependencies: ${EXTRA_DEPS:-<empty>}"
          if [ -n "${EXTRA_DEPS}" ]; then
            read -r -a EXTRA_DEPS_ARGS <<< "${EXTRA_DEPS}"
            echo "[Install dependencies] Purpose: install configured backend dependencies"
            run_uv_with_index_fallback \
              "explicit backend dependency installation" \
              uv pip install --python "${ACTIVE_PYTHON}" "${EXTRA_DEPS_ARGS[@]}"
          else
            echo "[Install dependencies] No explicit backend dependencies configured; skipping."
          fi

          TARGET_METADATA=$("${ACTIVE_PYTHON}" - "${FLAGOS_GPU_VENDOR:-}" <<'PY'
          import json
          import sys

          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib

          with open("target/pyproject.toml", "rb") as pyproject_file:
              pyproject = tomllib.load(pyproject_file)
          vendor = sys.argv[1]
          extras = pyproject.get("project", {}).get("optional-dependencies", {})
          print(json.dumps({
              "test_exists": "test" in extras,
              "vendor": vendor,
              "vendor_exists": bool(vendor) and vendor in extras,
              "available_extras": sorted(extras),
              "excluded_dependencies": pyproject.get("tool", {})
                  .get("uv", {}).get("exclude-dependencies", []),
          }))
          PY
          )
          echo "[Install dependencies] Target dependency metadata:"
          printf '%s\n' "${TARGET_METADATA}" | "${ACTIVE_PYTHON}" -m json.tool
          HAS_TEST=$(printf '%s' "${TARGET_METADATA}" | "${ACTIVE_PYTHON}" -c 'import json, sys; print("true" if json.load(sys.stdin)["test_exists"] else "false")')
          HAS_VENDOR=$(printf '%s' "${TARGET_METADATA}" | "${ACTIVE_PYTHON}" -c 'import json, sys; print("true" if json.load(sys.stdin)["vendor_exists"] else "false")')
          EXCLUDED_DEPENDENCIES=$(printf '%s' "${TARGET_METADATA}" | "${ACTIVE_PYTHON}" -c 'import json, sys; print(", ".join(json.load(sys.stdin)["excluded_dependencies"]) or "<none>")')

          echo "[Install dependencies] Target project source: ./target/pyproject.toml"
          echo "[Install dependencies] Test extra source: [project.optional-dependencies].test"
          echo "[Install dependencies] Detected test extra: ${HAS_TEST}"
          echo "[Install dependencies] Detected GPU vendor from flagos-gpu-check: ${FLAGOS_GPU_VENDOR:-<unavailable>}"
          echo "[Install dependencies] Vendor extra source: [project.optional-dependencies].${FLAGOS_GPU_VENDOR:-<unavailable>}"
          echo "[Install dependencies] Detected vendor extra: ${HAS_VENDOR}"
          echo "[Install dependencies] Exclusion policy source: [tool.uv].exclude-dependencies"
          echo "[Install dependencies] Detected excluded dependencies: ${EXCLUDED_DEPENDENCIES}"

          TARGET_EXTRAS=()
          if [ "${HAS_TEST}" = "true" ]; then
            TARGET_EXTRAS+=(test)
          fi
          if [ "${HAS_VENDOR}" = "true" ]; then
            TARGET_EXTRAS+=("${FLAGOS_GPU_VENDOR}")
          fi
          TARGET_PROJECT_SPEC="."
          SELECTED_EXTRAS="<none>"
          if [ "${#TARGET_EXTRAS[@]}" -gt 0 ]; then
            SELECTED_EXTRAS=$(IFS=,; echo "${TARGET_EXTRAS[*]}")
            TARGET_PROJECT_SPEC=".[${SELECTED_EXTRAS}]"
          else
            echo "[Install dependencies] No test or detected-vendor extra exists; installing the base project only."
          fi
          echo "[Install dependencies] Selected target extras: ${SELECTED_EXTRAS}"
          echo "[Install dependencies] Target install specification: ${TARGET_PROJECT_SPEC}"
          echo "[Install dependencies] Purpose: incrementally install the target repository without upgrading already-satisfied packages"
          (
            cd target
            run_uv_with_index_fallback \
              "target repository uv installation" \
              uv pip install --python "${ACTIVE_PYTHON}" --editable "${TARGET_PROJECT_SPEC}"
          )

      # Run ops tests.
      # OPS is provided by the prepare job: "all" (scheduled runs or an empty
      # "ops" input) runs every operator stage via --stages all; otherwise it
      # runs only the selected operators via --ops <list>.
      - name: Run ops tests
        working-directory: target
        # Per-repo step timeout from repos.yaml (ops_test_timeout_minutes),
        # resolved in prepare. This is the real test-duration limit; the
        # job-level timeout is just a large hard cap (see note above).
        timeout-minutes: ${{ matrix.ops_test_timeout }}
        env: ${{ fromJSON(matrix.test_env) }}
        shell: bash --login -e -o pipefail {0}
        run: |
          TARGET_COMMIT="$(git rev-parse HEAD)"
          echo "[Run ops tests] Target repository: ${TARGET_REPOSITORY}"
          echo "[Run ops tests] Target ref: ${TARGET_REF}"
          echo "[Run ops tests] Target commit: ${TARGET_COMMIT}"
          echo "[Run ops tests] Target working directory: $(pwd)"
          echo "[Run ops tests] Running on backend: ${{ matrix.name }} (vendor: ${{ matrix.vendor }})"
          echo "[Run ops tests] Container image: ${{ matrix.container_image }}"
          echo "[Run ops tests] Timeout: ${{ matrix.ops_test_timeout }} minutes"
          echo "[Run ops tests] Per-command timeout: ${{ matrix.op_cmd_timeout }} seconds"
          echo "[Run ops tests] Test output directory: ${OUTPUT_DIR}"
          echo "[Run ops tests] Test GPUs: ${AVAILABLE_GPUS}"
          echo "[Run ops tests] Test date: ${DATE}"
          echo "[Run ops tests] Test ops: ${TEST_OPS}"
          echo "[Run ops tests] Excluded ops: ${TEST_EXCLUDE_OPS:-<none>}"
          mkdir -p "${OUTPUT_DIR}"
          # remove cache to avoid potential issues with stale files
          rm -rf ~/.triton/cache && rm -rf ~/.flaggems
          # run tests with specified GPUs and output directory
          # Print env for debugging; drop proxy vars (http(s)_proxy/all_proxy,
          # any case) since they may embed user:password that GitHub Actions
          # does not auto-mask for values from the container/runner env.
          # printenv | grep -viE '^(https?_proxy|all_proxy)=' || true
          OPS="${TEST_OPS}"
          # Per-vendor FlagGems op-list probe. Only FlagGems keeps runner-local
          # include/exclude lists under /data/flaggems/<vendor>/; the probe is
          # vendor-agnostic so every vendor finds its own files on its runner.
          # Other repositories keep the default stage selection untouched.
          OP_INCLUDE_FILE=""
          OP_EXCLUDE_FILE=""
          if [ "${{ needs.prepare.outputs.library_name }}" = "FlagGems" ]; then
            # Use the vendor name reported by flagos-gpu-check (FLAGOS_GPU_VENDOR,
            # exported to GITHUB_ENV), which is already lowercase and matches the
            # runner directory layout under /data/flaggems/<vendor>/.
            VENDOR_DIR="${FLAGOS_GPU_VENDOR:-}"
            if [ -z "${VENDOR_DIR}" ]; then
              echo "[Run ops tests]   FLAGOS_GPU_VENDOR is empty; skipping op-list probe"
            else
              OP_LIST_INCLUDE="/data/flaggems/${VENDOR_DIR}/ops_include.txt"
              OP_LIST_EXCLUDE="/data/flaggems/${VENDOR_DIR}/ops_exclude.txt"
              echo "[Run ops tests] FlagGems op-list probe for vendor '${VENDOR_DIR}':"
              echo "[Run ops tests]   include candidate: ${OP_LIST_INCLUDE}"
              echo "[Run ops tests]   exclude candidate: ${OP_LIST_EXCLUDE}"
              if [ -f "${OP_LIST_INCLUDE}" ]; then
                OP_INCLUDE_FILE="${OP_LIST_INCLUDE}"
                echo "[Run ops tests]   include file found -> append --op-list-file"
              else
                echo "[Run ops tests]   include file missing -> skipped"
              fi
              if [ -f "${OP_LIST_EXCLUDE}" ]; then
                OP_EXCLUDE_FILE="${OP_LIST_EXCLUDE}"
                echo "[Run ops tests]   exclude file found -> append --exclude-op-list-file"
              else
                echo "[Run ops tests]   exclude file missing -> skipped"
              fi
            fi
          fi
          if [ "${OPS}" = "all" ]; then
            if [ -n "${OP_INCLUDE_FILE}" ]; then
              OP_ARGS="--op-list-file ${OP_INCLUDE_FILE}"
            else
              OP_ARGS="--stages all"
            fi
          else
            OP_ARGS="--ops ${OPS}"
          fi
          # Exclusions: an explicit workflow_dispatch input wins over the probed
          # file, matching the scheduler priority
          # --exclude-ops > --exclude-op-list-file.
          EXCLUDE_OPS_ARG=""
          if [ -n "${TEST_EXCLUDE_OPS}" ]; then
            EXCLUDE_OPS_ARG="--exclude-ops ${TEST_EXCLUDE_OPS}"
          elif [ -n "${OP_EXCLUDE_FILE}" ]; then
            EXCLUDE_OPS_ARG="--exclude-op-list-file ${OP_EXCLUDE_FILE}"
          fi
          # Optional per-repo ops baseline (repos.yaml base_data); path is
          # relative to the target checkout. Empty = not passed.
          BASE_DATA="${{ matrix.base_data }}"
          BASE_DATA_ARG=""
          if [ -n "${BASE_DATA}" ]; then
            BASE_DATA_ARG="--base-data ${BASE_DATA}"
          fi
          echo "[Run ops tests] Operator arguments: ${OP_ARGS}"
          echo "[Run ops tests] Exclusion arguments: ${EXCLUDE_OPS_ARG:-<none>}"
          echo "[Run ops tests] Base data: ${BASE_DATA:-<none>}"
          echo "[Run ops tests] Base-data arguments: ${BASE_DATA_ARG:-<none>}"
          # Run from the target checkout so the installed scheduler discovers
          # its conf/operators.yaml, tests/ and benchmark/ from the cwd.
          echo "[Run ops tests] Command: flagos-optest --gpus \"${AVAILABLE_GPUS}\" ${OP_ARGS} ${EXCLUDE_OPS_ARG} ${BASE_DATA_ARG} --timeout \"${{ matrix.op_cmd_timeout }}\" --dump-output --output-dir \"${OUTPUT_DIR}\""
          flagos-optest \
            --gpus "${AVAILABLE_GPUS}" \
            ${OP_ARGS} \
            ${EXCLUDE_OPS_ARG} \
            ${BASE_DATA_ARG} \
            --timeout "${{ matrix.op_cmd_timeout }}" \
            --dump-output \
            --output-dir "${OUTPUT_DIR}"
          # process the test results to generate summary files
          echo "[Run ops tests] Command: flagos-add-labels \"${OUTPUT_DIR}\""
          flagos-add-labels "${OUTPUT_DIR}"
          echo "[Run ops tests] Command: flagos-psum-text -o \"${OUTPUT_DIR}/result.csv\" \"${OUTPUT_DIR}\""
          flagos-psum-text -o "${OUTPUT_DIR}/result.csv" "${OUTPUT_DIR}"
          echo "[Run ops tests] Command: flagos-psum-html -o \"${OUTPUT_DIR}/result.html\" \"${OUTPUT_DIR}\""
          flagos-psum-html -o "${OUTPUT_DIR}/result.html" "${OUTPUT_DIR}"

      - name: Collect test summary
        id: test-summary
        if: always()
        shell: python3 {0}
        run: |
          import json
          import os
          from pathlib import Path

          summary_path = Path(os.environ["OUTPUT_DIR"]) / "summary.json"
          total_ops = ""
          total_duration = ""
          try:
              summary = json.loads(summary_path.read_text(encoding="utf-8"))
              if not isinstance(summary, dict):
                  raise ValueError("summary root must be a JSON object")
              total_ops_value = summary.get("total_ops")
              total_duration_value = summary.get("total_duration")
              if total_ops_value is not None:
                  total_ops = str(total_ops_value).strip()
              if total_duration_value is not None:
                  total_duration = str(total_duration_value).strip()
          except (OSError, TypeError, ValueError) as error:
              print(f"::warning::Failed to read test summary from {summary_path}: {error}")

          print(f"[Test summary] Total ops: {total_ops or '<empty>'}")
          print(f"[Test summary] Total duration: {total_duration or '<empty>'}")

          if total_ops and total_duration:
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write(f"total_ops={total_ops}\n")
                  output.write(f"total_duration={total_duration}\n")

      - name: Package results
        run: |
          ARCHIVE="${{ matrix.output_base_dir }}/${REPOSITORY_NAME}/${REPOSITORY_NAME}-${{ matrix.name }}-${DATE}.tar.gz"
          mkdir -p "${OUTPUT_DIR}" "$(dirname "${ARCHIVE}")"
          tar -czf "${ARCHIVE}" -C "$(dirname "${OUTPUT_DIR}")" "$(basename "${OUTPUT_DIR}")"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      # - name: Upload artifact
      #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      #   with:
      #     name: ops-test-${{ matrix.name }}-${{ needs.prepare.outputs.date }}
      #     path: ${{ env.ARCHIVE }}

      - name: Publish results to op-monitor
        if: needs.prepare.outputs.publish_results == 'true'
        # Three possible 900-second attempts plus two 15-second retry delays
        # need up to 45m30s; keep enough step-level overhead around that budget.
        timeout-minutes: 50
        continue-on-error: true
        run: |
          # get backend name from matrix
          BACKEND_NAME="${{ matrix.name }}"
          echo "[Publish results] Uploading results archive to op-monitor server for backend: ${BACKEND_NAME}"
          echo "[Publish results] Archive path: ${ARCHIVE}"
          echo "[Publish results] Test date: ${DATE}"
          # Check if the archive file exists before attempting to upload
          if [ ! -f "${ARCHIVE}" ]; then
            echo "[Publish results] ERROR: Archive file not found: ${ARCHIVE}"
            exit 1
          fi
          # Upload the results archive to the op-monitor server.
          curl -X POST "${{ secrets.OPMON_URL }}api/upload/archive" \
            -H "Authorization: Bearer ${{ secrets.OPMON_UPLOAD_KEY }}" \
            -F "file=@${ARCHIVE}" \
            -F "library_name=${{ needs.prepare.outputs.library_name }}" \
            -F "backend_name=${BACKEND_NAME}" \
            -F "test_date=${DATE}" \
            --max-time 900 --retry 2 --retry-delay 15 \
            --fail-with-body --compressed -o - -w "\nHTTP %{http_code}\n"

      - name: Send Feishu notification
        if: always() && needs.prepare.outputs.send_feishu == 'true'
        timeout-minutes: 5
        continue-on-error: true
        env:
          CI_STATUS: ${{ job.status }}
          PLATFORM: ${{ matrix.name }}
          # Title label: the full "<org>/<repo>" of the TARGET library under test
          # (e.g. flagos-ai/FlagGems-vllm), not optest's GITHUB_REPOSITORY.
          LIBRARY_NAME: ${{ needs.prepare.outputs.target_repo }}
          # Ref and commit must reflect the TARGET repo, not the optest run.
          # checkout_ref is the explicit workflow `ref` input when provided,
          # otherwise the target repo's configured default_branch.
          TARGET_REF: ${{ needs.prepare.outputs.checkout_ref }}
          OVERRIDE_SHA: ${{ steps.target-info.outputs.sha }}
          TOTAL_OPS: ${{ steps.test-summary.outputs.total_ops }}
          TOTAL_DURATION: ${{ steps.test-summary.outputs.total_duration }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_CHAT_ID: ${{ secrets.FEISHU_CHAT_ID }}
        run: python3 .github/scripts/notify_feishu.py
