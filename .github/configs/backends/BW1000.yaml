# Shared backend hardware configuration (repo-agnostic).
# This file defines environment settings for operator testing
name: BW1000
vendor: Hygon


# Runner labels for this backends (self-hosted)
runner_labels: bw1000-flaggems-weekly

# Container image for this backend (DEFAULT).
# Priority: repos.yaml `images.<BACKEND>` for the selected repo OVERRIDES
# this value; when that repo has no override here, this default is used.
container_image: harbor.baai.ac.cn/flagos-app/vllm0.24.0-hygon-dtk26.04:2.2.0-0.3.0

# Container volumes to mount for this backends
container_volumes:
  - /opt/hyhal:/opt/hyhal
  - /etc/localtime:/etc/localtime:ro
  - /data:/data
  - /home:/home
  - /tmp:/tmp

# Container options for this backends
container_options: >-
  --ipc=host
  --privileged
  --group-add video
  --cap-add=SYS_PTRACE
  --security-opt seccomp=unconfined
  --device=/dev/kfd
  --device=/dev/mkfd
  --device=/dev/dri

# Backend-specific FlagTree daily wheel. The workflow uses this full version
# unless workflow_dispatch supplies a full version or YYYYMMDD override.
flagtree:
  package_name: flagtree-hcu
  version: 0.7.1.dev20261111
  index_url: https://resource.flagos.net/repository/flagos-pypi-daily/simple

# Extra environment variables injected only into the "Run ops tests" step
test_env:
  GEMS_VENDOR: hygon

# Output base directory; ops-test appends the GitHub repository name
output_base_dir: /data/github-outputs
