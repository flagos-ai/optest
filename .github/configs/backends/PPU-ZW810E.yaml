# Shared backend hardware configuration (repo-agnostic).
# This file defines environment settings for operator testing
name: PPU-ZW810E
vendor: THead

# Runner labels for this backends (self-hosted)
runner_labels: 810e-flaggems-weekly

test_env:
  UV_SKIP_WHEEL_FILENAME_CHECK: "1"

# Container image for this backend (DEFAULT).
# Priority: repos.yaml `images.<BACKEND>` for the selected repo OVERRIDES
# this value; when that repo has no override here, this default is used.
container_image: harbor.baai.ac.cn/flagos-app/vllm0.32.0-thead-ppu2.1.0:2.3.0-0.5.0.dev0_g814b6d3.d20261117

# Container volumes to mount for this backends
container_volumes:
  - /mnt/data1:/data

# Container options for this backends
# NOTE: do not add --network=host here. GitHub Actions always attaches job
# containers to its own user-defined network, and Docker rejects combining a
# user-defined network with host mode ("cannot attach both user-defined and
# non-user-defined network-modes").
container_options: >-
  --device=/dev/alixpu
  --device=/dev/alixpu_ctl
  --device=/dev/alixpu_ppu0
  --device=/dev/alixpu_ppu1
  --device=/dev/alixpu_ppu2
  --device=/dev/alixpu_ppu3
  --device=/dev/alixpu_ppu4
  --device=/dev/alixpu_ppu5
  --device=/dev/alixpu_ppu6
  --device=/dev/alixpu_ppu7
  --device=/dev/alixpu_ppu8
  --device=/dev/alixpu_ppu9
  --device=/dev/alixpu_ppu10
  --device=/dev/alixpu_ppu11
  --device=/dev/alixpu_ppu12
  --device=/dev/alixpu_ppu13
  --device=/dev/alixpu_ppu14
  --device=/dev/alixpu_ppu15
  --shm-size=256g
  --ulimit=memlock=-1
  --ulimit=stack=67108864
  --workdir=/root

# Backend-specific FlagTree daily wheel. This backend mapping is the workflow's
# sole source for the exact package version and index.
deps:
  flagtree-ppu:
    display_name: FlagTree
    priority: 100
    version: 0.7.1.dev20261125
    index_url: https://resource.flagos.net/repository/flagos-pypi-daily/simple
    no_deps: true
    target: /opt/flagtree

# Output base directory; ops-test appends the GitHub repository name
output_base_dir: /home/github-outputs
