# ---------------------------------------------------------------------------
# Central per-repo configuration for the shared ops-test workflow.
#
# This single file lets flagos-ai/optest drive operator tests for every FlagOS
# library repo. The `repo` workflow input selects one entry under `repos:`.
# The MAP KEY (e.g. FlagGems) is used for three things at once:
#   1. checkout target     -> <org>/<key>
#   2. upload library_name  -> passed to op-monitor as `library_name=<key>`
#   3. Feishu notification label
# so there is no separate github/library_name/import_name field. The tested
# library is auto-detected at runtime by flagos-optest (try-import), so no
# import name needs to be configured here either.
#
# Container images are defined per hardware in .github/configs/backends/<NAME>.yaml
# and shared by all repos. A repo only needs a `container_images:` block when its
# images differ from those defaults (e.g. FlagGems-sglang ships sglang images).
#
# To onboard a new repo: add one block under `repos:` with its default_branch,
# enabled backends, and (optionally) container_images / deps / base_data /
# timeout. No workflow or script change is required.
# ---------------------------------------------------------------------------

# GitHub organization that owns every target repo. Combined with the repo key
# to form the checkout target "<org>/<repo>".
org: flagos-ai

# op-monitor upload endpoint (shared by all repos).
server:
  api: http://10.1.4.213:31080/api/upload/archive

# Defaults applied to every repo unless overridden in its block below.
defaults:
  # Per-vendor "Run ops tests" STEP timeout (minutes). The container/native
  # job keeps a large hard cap at the job level (GitHub Actions cannot read a
  # matrix value for a job-level timeout); the real per-repo limit lives on the
  # test step. Override per repo via `ops_test_timeout_minutes`.
  ops_test_timeout_minutes: 240

repos:
  # =========================================================================
  FlagGems:
    # Branch used when the `branch` workflow input is empty.
    default_branch: master
    # Full operator suite; 910B alone runs ~15h, so allow a long step timeout.
    ops_test_timeout_minutes: 1440
    # Uses the shared backend images (.github/configs/backends/<NAME>.yaml);
    # no per-repo container_images override needed.
    # Backends this repo runs. enabled:false skips the backend entirely.
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: true}
      P800: {enabled: true}
      W7900D: {enabled: true}
      TX8110: {enabled: false}
      S60: {enabled: true}   # Enflame op-list path lives on this runner only.

  # =========================================================================
  FlagGems-vllm:
    default_branch: main
    # Optional ops-baseline JSON (relative to the target repo checkout). Only
    # FlagGems-vllm wires an external baseline today; other repos leave this
    # unset so --base-data is not passed.
    base_data: tools/op_vllm_perf_baseline.json
    # Uses the shared backend images (vllm), no override needed.
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

  # =========================================================================
  FlagGems-sglang:
    default_branch: master
    # sglang ships its own images per backend, so this repo OVERRIDES the shared
    # backend defaults. Keep only backends enabled below.
    container_images:
      910B: harbor.baai.ac.cn/flagos-app/sglang0.5.18-ascend-cann9.0.0:2.1.2-0.1.dev1_g2e568482e
      BI-V150: harbor.baai.ac.cn/flagos-app/sglang0.5.18-iluvatar-corex4.5.0:2.2.0-0.1.dev1_g201484665
      BW1000: harbor.baai.ac.cn/flagos-app/sglang0.5.18-hygon-dtk26.04:2.1.2-0.1.dev1_g440208beb
      C550: harbor.baai.ac.cn/flagos-app/sglang0.5.18-metax-maca3.8.1.3:2.1.2-0.1.dev1_g0900c244b
      H800: harbor.baai.ac.cn/flagos-app/sglang0.5.11-generic-c13.0:2.2.0-0.2.0
      MTT-S5000: harbor.baai.ac.cn/flagos-app/sglang0.5.18-mthreads-musa5.2.0:2.2.0-0.1.dev1_g607b9672c
      P800: harbor.baai.ac.cn/flagos-app/sglang0.5.18-kunlunxin-xre5.37.1:2.1.2-0.1.dev1_g7fb22a0c2
      S60: harbor.baai.ac.cn/flagos-app/sglang0.5.18-enflame-tops1.10.6:2.2.0-0.1.dev1_g65dff2733
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: false}  # sglang: disabled for now.
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

  # =========================================================================
  FlagTrain:
    default_branch: main
    # FlagTrain uses Megatron-RL images and maintains vendor dependencies as
    # optional-dependency groups in its own pyproject.toml.
    # NVIDIA images provide the compatible torch/Triton stack. FlagTrain's
    # [tool.uv].exclude-dependencies policy preserves those image packages.
    container_images:
      H800: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-generic-13.3:2.2.0-0.2.3
      BW1000: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-hygon-dtk26.04:2.2.0-0.2.3
      BI-V150: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-iluvatar-corex4.5.0:2.2.0-0.2.3
      P800: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-kunlunxin-xre5.37.1:2.2.0-0.2.3
      910B: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-ascend-cann9.0.0:2.2.0-0.2.3
      C550: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-metax-maca3.8.1.3:2.2.0-0.2.3
      MTT-S5000: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-mthreads-musa5.2.0:2.2.0-0.2.3
      S60: harbor.baai.ac.cn/flagos-app/megatron_rl0.17.1-enflame-tops1.10.6:2.2.0-0.2.3
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: false}
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: true}

  # =========================================================================
  FlagAttention:
    default_branch: main
    # Uses the shared backend images (vllm), no override needed.
    backends:
      H800: {enabled: true}
      910B: {enabled: true}
      C550: {enabled: true}
      BW1000: {enabled: true}
      MTT-S5000: {enabled: true}
      BI-V150: {enabled: true}
      PPU-ZW810E: {enabled: true}
      MLU590-M9DE: {enabled: false}
      P800: {enabled: true}
      W7900D: {enabled: false}
      TX8110: {enabled: false}
      S60: {enabled: false}   # Enflame disabled outside FlagGems for now.

# ---------------------------------------------------------------------------
# Optional explicit dependency install (example; omit the whole key to skip):
# Target-specific vendor dependencies should normally live under
# [project.optional-dependencies] in the target repository's pyproject.toml;
# the workflow automatically installs the group matching flagos-gpu-check's
# normalized vendor key.
# If a runtime image already supplies a hardware-specific package that must not
# be selected from a vendor extra's transitive dependency graph, declare it in
# the target repository's [tool.uv].exclude-dependencies list. The workflow
# installs the available test and detected-vendor extras with `uv pip install`.
#
#   repos:
#     SomeRepo:
#       deps:
#         default: ["extra-pkg==1.2.3"]   # installed on every enabled backend
#         910B: ["ascend-only==0.4"]      # ADDED only on the 910B backend
#
# Resolution order appended together: backends/<NAME>.yaml `deps` (hardware
# default) + repo deps.default + repo deps.<backend>. Empty -> install skipped.
# Backend-level `deps` and `container_image` in backends/<NAME>.yaml act as
# defaults; the per-repo `deps` here EXTEND them and `container_images` here
# OVERRIDE the image.
# ---------------------------------------------------------------------------
