# ---------------------------------------------------------------------------
# Central configuration for optest-managed application container images.
#
# Published image name pattern:
#   <registry.host>/<registry.project>/<app><app_version>-<stack>:<image_version>
#   e.g. harbor.baai.ac.cn/flagos-optest/vllm0.32.0-ascend-cann9.0.0:20261127-c0f9bdc
#
# image_version is computed by the workflow, not entered by hand:
#   <build date YYYYMMDD>-<short commit id of the optest checkout>
# Every rebuild therefore produces a distinct, traceable tag.
#
# Stack key follows build-infra convention: {vendor}-{runtime}{version}
#   e.g. ascend-cann9.0.0, metax-maca3.8.1.3, nvidia-cuda13.0
# Stacks that differ only in hardware generation (910b vs 910c, S60 vs L600)
# are SEPARATE entries — their runtimes are incompatible.
#
# Two-layer version model:
#   baked:     FlagTree / FlagGems / plugin-fl versions here are installed at
#              docker build time. Update by rebuilding and republishing the image.
#   hot-patch: ops-test.yaml "Upgrade configured packages" step reinstalls a
#              newer daily version at test time without a full image rebuild.
#              Use for minor bumps; bake a new image for breaking changes.
#
# Torch / runtime protection:
#   The vllm and megatron Dockerfiles generate /tmp/protect.txt from
#   /etc/flagos/flaggems-constraints.txt (written by the runtime base image)
#   plus a live freeze snapshot. Every uv pip install uses -c /tmp/protect.txt
#   so torch, triton, and other pinned packages are never touched.
#
# skip_build stacks:
#   skip_build: true means the workflow skips the Dockerfile build and treats
#   a pre-existing image as the result (still runs the verify gate). No stack
#   uses it today; every app builds from its own Dockerfile.
# ---------------------------------------------------------------------------

registry:
  host: harbor.baai.ac.cn
  project: flagos-optest

# Base Nexus for all package indexes. Per-stack nexus_host overrides the host
# only (keeps /repository/... path), matching build-infra nexus_overrides logic.
pypi:
  base: https://resource.flagos.net

# Default component versions baked into every image.
# Override per-stack with flagtree_version / flaggems_version.
components:
  flagtree:
    version: 0.7.1.dev20261125
    index_url: https://resource.flagos.net/repository/flagos-pypi-daily/simple
    target: /opt/flagtree
  flaggems:
    version: 5.5.0.dev20261123
    index_url: https://resource.flagos.net/repository/flagos-pypi-daily/simple

apps:
  # ===========================================================================
  # vLLM 0.32.0 app images.
  # Repacked wheel on each vendor index as vllm=={version}+flagos.
  # vllm-plugin-fl provides the FL acceleration layer per backend.
  # ===========================================================================
  vllm:
    version: "0.32.0"
    stacks:
      nvidia-cuda13.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-generic-c13.0:2.3.0
        backend: H800
        vendor: nvidia
        flagtree_package: flagtree-nvidia
        plugin_fl_version: "0.5.0.dev0_g814b6d3.d20261117"
        flagcx_version: ""
        app_env: ""

      ascend-cann9.0.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-ascend-cann9.0.0:2.3.0
        backend: 910B
        vendor: ascend
        flagtree_package: flagtree-ascend-cann9.0.0
        plugin_fl_version: "0.5.0.dev0_g814b6d3.d20261117"
        flagcx_version: ""
        app_env: ""

      metax-maca3.8.1.3:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-metax-maca3.8.1.3:2.3.0
        backend: C550
        vendor: metax
        flagtree_package: flagtree-metax
        plugin_fl_version: "0.3.0"
        flagcx_version: ""
        app_env: "MACA_DIRECT_DISPATCH=1\nFLAGTREE_BACKEND=metax"

      hygon-dtk26.04:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-hygon-dtk26.04:2.3.0
        backend: BW1000
        vendor: hygon
        flagtree_package: flagtree-hygon-dtk26.04
        plugin_fl_version: "0.3.0"
        flagcx_version: ""
        app_env: ""

      mthreads-musa5.2.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-mthreads-musa5.2.0:2.3.0
        backend: MTT-S5000
        vendor: mthreads
        flagtree_package: flagtree-mthreads
        plugin_fl_version: "0.3.0"
        flagcx_version: ""
        app_env: ""

      iluvatar-corex5.0.1:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-iluvatar-corex5.0.1:2.3.0
        backend: BI-V150
        vendor: iluvatar
        flagtree_package: flagtree-iluvatar
        plugin_fl_version: "0.5.0.dev0_g814b6d3.d20261117"
        flagcx_version: ""
        app_env: ""

      kunlunxin-xre5.37.1:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-kunlunxin-xre5.37.1:2.3.0
        backend: P800
        vendor: kunlunxin
        flagtree_package: flagtree-kunlunxin
        plugin_fl_version: "0.3.0"
        flagcx_version: ""
        # Required for correct FL decode performance on P800.
        app_env: "VLLM_FL_USE_DEVICE_ATTN=1\nVLLM_FL_DEVICE_MAX_BATCH_SIZE=32"

      enflame-tops1.10.6:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-enflame-tops1.10.6:2.3.0
        backend: S60
        vendor: enflame
        flagtree_package: flagtree-enflame
        plugin_fl_version: "0.3.0"
        flagcx_version: ""
        app_env: ""

  # ===========================================================================
  # Megatron 0.18.2+0.3.0 (megatron-core) app images.
  # ===========================================================================
  megatron:
    version: "0.18.2+0.3.0"
    stacks:
      nvidia-cuda13.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-generic-c13.0:2.3.0
        backend: H800
        vendor: nvidia
        flagtree_package: flagtree-nvidia
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

      ascend-cann9.0.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-ascend-cann9.0.0:2.3.0
        backend: 910B
        vendor: ascend
        flagtree_package: flagtree-ascend-cann9.0.0
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

      metax-maca3.8.1.3:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-metax-maca3.8.1.3:2.3.0
        backend: C550
        vendor: metax
        flagtree_package: flagtree-metax
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: "MACA_DIRECT_DISPATCH=1\nFLAGTREE_BACKEND=metax"

      hygon-dtk26.04:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-hygon-dtk26.04:2.3.0
        backend: BW1000
        vendor: hygon
        flagtree_package: flagtree-hygon-dtk26.04
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

      mthreads-musa5.2.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-mthreads-musa5.2.0:2.3.0
        backend: MTT-S5000
        vendor: mthreads
        flagtree_package: flagtree-mthreads
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

      iluvatar-corex5.0.1:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-iluvatar-corex5.0.1:2.3.0
        backend: BI-V150
        vendor: iluvatar
        flagtree_package: flagtree-iluvatar
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

      kunlunxin-xre5.37.1:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-kunlunxin-xre5.37.1:2.3.0
        backend: P800
        vendor: kunlunxin
        flagtree_package: flagtree-kunlunxin
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

      thead-ppu2.1.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-thead-ppu2.1.0:2.3.0
        backend: PPU-ZW810E
        vendor: thead
        flagtree_package: flagtree-thead
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

      enflame-tops1.10.6:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-enflame-tops1.10.6:2.3.0
        backend: S60
        vendor: enflame
        flagtree_package: flagtree-enflame
        plugin_fl_version: ""
        flagcx_version: ""
        app_env: ""

  # ===========================================================================
  # sglang 0.5.18 app images.
  # Repacked wheel on each vendor index as sglang=={version}+flagos.
  # sglang-plugin-fl (sglang_fl) provides the FL acceleration layer.
  # SGLANG_IS_FLASHINFER_AVAILABLE, TORCHINDUCTOR_COMPILE_THREADS, and
  # SGLANG_SKIP_SGL_KERNEL_VERSION_CHECK are baked via ENV in the Dockerfile
  # and do not need to appear in app_env here unless overridden per vendor.
  #
  # plugin_fl_version: git ref/tag for sglang-plugin-FL. The Dockerfile
  # clones and builds the wheel in-container. Empty = skip plugin install.
  # sgl_kernel_shim_version: version of sgl-kernel-shim on the vendor index,
  # which supplies the sgl_kernel import face the repacked wheel omits.
  # Empty = skip the shim install (import would then require a real
  # sgl-kernel on that index).
  # ===========================================================================
  sglang:
    version: "0.5.18"
    stacks:
      nvidia-cuda13.0:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-generic-c13.0:2.3.0
        backend: H800
        vendor: nvidia
        flagtree_package: flagtree-nvidia
        plugin_fl_version: ""
        sgl_kernel_shim_version: ""
        app_env: ""

      ascend-cann9.0.0:
