        app_env: ""

      iluvatar-corex5.0.1:
        base_image: harbor.baai.ac.cn/flagos-runtime/flagos-runtime-iluvatar-corex5.0.1:2.3.0
        backend: BI-V150
        vendor: iluvatar
        flagtree_package: flagtree-iluvatar
        plugin_fl_version: ""
